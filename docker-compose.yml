# ============================================================================
# Docker Compose Configuration for Payment Project
# ============================================================================
#
# FIRST-TIME SETUP:
#   1. cp .env.example .env      (then edit passwords if you like)
#   2. docker compose up --build
#
# Then open http://localhost:3000 — that's the only URL you need. The frontend
# nginx proxies /api through to the backend, so the browser never talks to
# port 8000 directly and there is no CORS involved.
#
# EVERYDAY USE:
#   docker compose up              start everything (no rebuild)
#   docker compose up --build      rebuild after changing code or deps
#   docker compose down            stop
#   docker compose down -v         stop AND wipe the database
#   docker compose logs -f backend log tail (or: frontend, db)
#
# The API docs stay reachable at http://localhost:8000/docs — the backend port
# is published mainly so you can poke at Swagger directly.
# ============================================================================

services:
  # =========================================================================
  # FRONTEND — React + Vite, built to static files and served by nginx
  # =========================================================================
  frontend:
    container_name: p2p-frontend
    build:
      context: ./p2p_Frontend
      dockerfile: DockerFile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - payment-network
    restart: unless-stopped
    # Health check lives in p2p_Frontend/DockerFile (as it does for the
    # backend), so the image is self-describing and there is only one
    # definition to keep correct.

  # =========================================================================
  # BACKEND — FastAPI + Uvicorn
  # =========================================================================
  backend:
    container_name: p2p-backend
    build:
      context: ./p2p_Backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Host is "db" — the compose service name, resolved over payment-network.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # nginx proxies /api same-origin, so CORS only matters for `npm run dev`
      # against a directly-published backend port.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        # Waits for the healthcheck below, not just for the container to exist.
        # MySQL takes ~20s to initialize on first run and the backend creates
        # its tables at startup, so it would crash without this.
        condition: service_healthy
    networks:
      - payment-network
    restart: unless-stopped

  # =========================================================================
  # DATABASE — MySQL 8
  # =========================================================================
  db:
    container_name: p2p-database
    image: mysql:8.0
    # MUST match the COLLATE that p2p_DB/seed.sql declares on every table
    # (utf8mb4_0900_ai_ci, MySQL 8's own default). The schema default is what
    # tables created at runtime by Base.metadata.create_all inherit, and MySQL
    # rejects a foreign key whose two columns differ in collation — so a
    # mismatch here makes any NEW table that references a seeded one fail to
    # create with "error 3780: ... are incompatible".
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Published so you can connect with MySQL Workbench / DBeaver on
      # localhost:3306. Remove this line in any real deployment.
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-loaded by the mysql image on FIRST init only (empty volume). Lets a
      # fresh `down -v` + `up` restore the migrated data. Ignored on restarts,
      # so it never clobbers live data. Runs before the backend connects because
      # the healthcheck below only passes once init (including this) completes.
      - ./p2p_DB/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      # Tables are created by the backend at startup (Base.metadata.create_all
      # in app/main.py), so this only needs to confirm the server accepts
      # connections — no init SQL script is involved.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  payment-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
